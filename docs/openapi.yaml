openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: <http://www.apache.org/licenses/LICENSE-2.0.html>
  description: >
    This is a documentation of Contacts app
tags:
  - name: Contacts
    description: Operations about users.
  - name: Auth
    description: Auth operations.
servers:
  - url: http://localhost:3000/api
  - url: http://localhost:3000
paths:
  /contacts/{id}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
    put:
      $ref: ../swagger/paths/contacts/{id}/put.yaml
  /contacts/{id}/favorite:
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /users/avatar:
    patch:
      $ref: ../swagger/paths/users/patch.yaml
  /users/verify:
    post:
      $ref: ../swagger/paths/users/post.yaml
  /users/verify/{verificationToken}:
    patch:
      $ref: ../swagger/paths/users/get.yaml
  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login.yaml
  /auth/logout:
    get:
      $ref: ../swagger/paths/auth/logout.yaml
  /auth/current:
    get:
      $ref: ../swagger/paths/auth/current.yaml
  /auth:
    patch:
      $ref: ../swagger/paths/auth/subscription.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
