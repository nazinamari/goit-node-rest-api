type: object
required:
  - _id
  - name
  - phone
  - owner
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  email:
    description: "Contact's email"
    type: string
    example: 'nzyame@gmail.com'
  phone:
    description: "Contact's phone"
    type: string
    example: '123456789123'
  favorite:
    description: 'Satus of the contact'
    type: boolean
    example: false
  owner:
    description: "Contact's User id"
    type: string
    example: 65e4decdd286b30065d54af9
