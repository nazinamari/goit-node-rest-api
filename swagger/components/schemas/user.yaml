type: object
required:
  - name
  - email
  - password
  - verificationToken
properties:
  name:
    description: "User's name"
    type: string
    example: 'John Doe'
  email:
    description: "Users's email"
    type: string
    example: 'nzyame@gmail.com'
  password:
    description: "User's password"
    type: string
    example: 'Solid1234'
  avatarURL:
    description: "Link to User's avatar"
    type: string
    example: <https://res.cloudinary.com/uqwgdu/image/upload/image.png>
  subscription:
    description: "User's subscription"
    type: string
  verificationToken:
    description: "Link to User's avatar"
    type: string
    example: '1e06baac-fbeb-4586-97ca-85f69cccc744'
